services:
  telegram-analysis:
    build:
      context: .
      target: production
    image: telegram-analysis:local
    # Stdio: no listening ports, webhooks or public IP required.
    stdin_open: true
    read_only: true
    user: "${TELEGRAM_ANALYSIS_UID:-10001}:${TELEGRAM_ANALYSIS_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    volumes:
      - "${TELEGRAM_ANALYSIS_STATE:-./private_state}:/state"
