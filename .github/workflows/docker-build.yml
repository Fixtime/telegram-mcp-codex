name: Telegram Analysis Container
on:
  push:
    branches: [main, codex-analysis]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target production -t telegram-analysis:ci .
      - run: docker build --target development -t telegram-analysis:test .
      - run: docker run --rm telegram-analysis:test
