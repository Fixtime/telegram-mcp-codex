name: Telegram Analysis Format
on:
  push:
    branches: [main, codex-analysis]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-analysis-dev.lock
      - run: python -m black --check telegram_analysis analysis_tests telegram_analysis_mcp.py main.py
